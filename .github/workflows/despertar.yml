name: Mantener despierta la base de datos
on:
  schedule:
    - cron: "17 8 * * 1,4"   # lunes y jueves (Supabase gratis se pausa tras 7 días sin uso)
  workflow_dispatch:
  push:
    paths: [scripts/despertar.py, .github/workflows/despertar.yml]
jobs:
  despertar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/despertar.py
